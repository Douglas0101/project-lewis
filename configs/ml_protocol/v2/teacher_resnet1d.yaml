# ML Protocol v2 — teacher ResNet1D (trilha D, adendo T10.2.1 §3)
# Teacher = ferramenta de TREINO, nunca produção. Sem restrições TFLM/QG6/QG9.
# Nunca vira header C, nunca entra em models/, nunca toca firmware.
profile: teacher_resnet1d
schema_version: 2.0
task_profile: pretrain_scp_ecg_multilabel

archetypes:
  resnet1d_leve:
    cell: D1
    blocks: [32, 64, 128, 256]        # ajustado para atingir o ALVO (nota de honestidade paramétrica do adendo §3)
    kernel_sizes: [7, 5, 5, 3]
    params_target: 500000
    params_tolerance: 0.10            # ±10% — pino final com teste de orçamento
    residual: true
    normalization: GroupNorm          # BatchNorm instável com batches pequenos; TFLM não se aplica
    activation: relu
    dropout: 0.2
    head: linear_sigmoid_5

  resnet1d_padrao:
    cell: D2
    blocks: [64, 128, 256, 512]       # alvo ~1M (adendo §3: [32,64,128,256] renderia ~460k)
    kernel_sizes: [15, 7, 5, 3]       # RF ≥ QT — coerente com hipótese H3
    params_target: 1000000
    params_tolerance: 0.10
    residual: true
    normalization: GroupNorm
    activation: relu
    dropout: 0.2
    head: linear_sigmoid_5

budget_test:
  required: true                    # teste de orçamento de params, padrão tests/test_backbone_budget.py
  enforcement: "qualquer mudança arquitetural acidental quebra o teste antes do treino"

training:
  task: pretrain_scp_ecg_multilabel
  split_id: chapman-record-disjoint-paired-v2
  loss: focal                       # γ conforme trilha F vencedora; default 2.0
  focal_gamma: 2.0
  optimizer: adamw
  weight_decay: 0.0001
  lr: 0.001
  schedule: cosine
  warmup_epochs: 2
  max_epochs: 50
  early_stopping:
    metric: val_macro_pr_auc
    mode: max
    patience: 10
  frozen_after_train: true          # teacher congelado antes da destilação (adendo §4)

evaluation:
  evaluator: canonical_v2
  offline_only: true                # sem QGs de firmware; avaliação offline com protocolo v2
  metrics: [macro_pr_auc, macro_auroc, per_class_pr_auc, ece_post_calibration, ece_post_calibration_norm0]
