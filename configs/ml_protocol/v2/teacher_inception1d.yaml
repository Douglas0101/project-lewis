# ML Protocol v2 — teacher Inception1D (trilha D, célula D4, adendo T10.2.1 §3)
# Teacher = ferramenta de TREINO, nunca produção. D4 só executa se D2 ≥ +3 p.p. CD PR-AUC
# (regra anti-desperdício) e com aprovação humana (compute alto).
profile: teacher_inception1d
schema_version: 2.0
task_profile: pretrain_scp_ecg_multilabel

archetypes:
  inception1d:
    cell: D4
    branches: [[32, 3], [32, 7], [32, 15], [16, 31]]   # [filters, kernel] por branch — multi-scale (H3)
    blocks: 4
    params_target: 5000000
    params_tolerance: 0.15           # ~1–5M conforme crescimento de canais (adendo §3) — pino em design review
    residual: true
    normalization: GroupNorm
    activation: relu
    dropout: 0.3
    head: linear_sigmoid_5

budget_test:
  required: true

training:
  task: pretrain_scp_ecg_multilabel
  split_id: chapman-record-disjoint-paired-v2
  loss: focal
  focal_gamma: 2.0
  optimizer: adamw
  weight_decay: 0.0001
  lr: 0.001
  schedule: cosine
  warmup_epochs: 2
  max_epochs: 50
  early_stopping:
    metric: val_macro_pr_auc
    mode: max
    patience: 10
  frozen_after_train: true

evaluation:
  evaluator: canonical_v2
  offline_only: true
  metrics: [macro_pr_auc, macro_auroc, per_class_pr_auc, ece_post_calibration, ece_post_calibration_norm0]

execution_gate:
  conditional_on: "D2 com ganho ≥ +3 p.p. em CD PR-AUC"
  human_approval: required          # compute alto (~8 h CPU estimado)
