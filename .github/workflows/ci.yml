name: CI — Hard Gates

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  ALLOW_STUB: "0"
  CI: "1"

jobs:
  hard-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make curl tar binutils

      - name: Install Python dependencies
        run: |
          uv sync --frozen
          uv pip install robotframework

      - name: Cache firmware toolchain / Renode
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: firmware/tools
          key: >-
            ${{
              format(
                'firmware-tools-{0}-{1}',
                runner.os,
                hashFiles('firmware/scripts/install_deps.sh')
              )
            }}
          restore-keys: |
            firmware-tools-${{ runner.os }}-

      - name: Install firmware tooling
        run: uv run make firmware-deps

      - name: Cache TFLM build
        id: cache-tflm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: firmware/third_party/tflite-micro
          key: >-
            ${{
              format(
                'tflm-{0}-{1}',
                runner.os,
                hashFiles(
                  'firmware/third_party/tflite-micro.commit',
                  'firmware/scripts/install_tflm.sh'
                )
              )
            }}
          restore-keys: |
            tflm-${{ runner.os }}-

      - name: Install / cache TFLM
        run: uv run make firmware-tflm

      - name: Verify Renode Version
        run: uv run make verify-renode

      - name: Run hard gates
        run: uv run make hard-gates-ci

      - name: Upload firmware artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firmware-hard-gates
          path: |
            firmware/build/stm32f4/*.elf
            firmware/build/stm32f4/*.bin
            firmware/build/stm32f4/*.map
            reports/*.json
            reports/*.md
