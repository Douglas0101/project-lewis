sonar.projectKey=Douglas0101_project-lewis
sonar.organization=douglas0101

# Python version used by the project; avoids "analyzed as compatible with all Python 3 versions" warning.
sonar.python.version=3.12

# Force UTF-8 source encoding; avoids "problems with file encoding" warnings.
sonar.sourceEncoding=UTF-8

# Exclude generated, vendored, data and artifact directories from analysis.
sonar.exclusions=\
  .venv/**,\
  .git/**,\
  .github/**,\
  .pytest_cache/**,\
  .mypy_cache/**,\
  __pycache__/**,\
  firmware/third_party/**,\
  firmware/tools/**,\
  firmware/build/**,\
  data/**,\
  models/**,\
  experiments/**,\
  notebooks/**,\
  snapshots/**,\
  build/**

# Exclusoes especificas da analise de DUPLICACAO (CPD), mantidas no escopo de
# analise para os demais checks:
# - scripts/run_stage2_e06_*_ablation.py: runners de ablacao E06 deliberadamente
#   separados por representacao (config, split, manifest e I/O auditaveis por
#   arquivo); o boilerplate compartilhado e intencional para reproducibilidade
#   da pesquisa. ~80% da duplicacao reportada no PR #11.
# - firmware/src/ml/stage*_int8_*.h: headers de modelo AUTOGENERATED (arrays
#   int8 do TFLite); nao sao codigo mantido a mao.
sonar.cpd.exclusions=\
  scripts/run_stage2_e06_*_ablation.py,\
  firmware/src/ml/stage1_int8_v2.0.h,\
  firmware/src/ml/stage2_int8_v2.0.h
