    - ce_control
    - crt_patient_aware
    - logit_adjustment
    - balanced_softmax
    - ldam_drw
    - focal_legacy
  screening_seeds: [17, 29, 43]
  final_seeds: [17, 29, 43, 71, 101]
  logit_adjustment_tau: 1.0
  ldam_max_margin: 0.5
  ldam_drw_epoch_fraction: 0.5
  focal_alpha: [0.20, 0.15, 3.00]
